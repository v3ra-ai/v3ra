<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="512" height="512" rx="128" fill="#0a0a0a"/>
  
  <!-- Gradient -->
  <defs>
    <linearGradient id="iconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c084fc;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#f472b6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c084fc;stop-opacity:1" />
    </linearGradient>
    <filter id="largeNeon" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="coloredBlur"/>
      <feGaussianBlur stdDeviation="6" result="coloredBlur2"/>
      <feGaussianBlur stdDeviation="3" result="coloredBlur3"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="coloredBlur2"/>
        <feMergeNode in="coloredBlur3"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Clean neon checkmark -->
  <path 
    d="M140 256 L200 330 L372 150" 
    stroke="url(#iconGradient)" 
    stroke-width="28" 
    stroke-linecap="round" 
    stroke-linejoin="round" 
    fill="none"
    filter="url(#largeNeon)"
  />
</svg>
