<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline - v3ra</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a0a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
        }
        
        .container {
            max-width: 400px;
            padding: 2rem;
        }
        
        .logo {
            width: 120px;
            height: 60px;
            margin: 0 auto 2rem;
            background: url('/logos/v3ralogo.png') no-repeat center;
            background-size: contain;
        }
        
        .title {
            font-size: 2rem;
            font-weight: 600;
            margin-bottom: 1rem;
            color: #00d4ff;
        }
        
        .message {
            font-size: 1.1rem;
            margin-bottom: 2rem;
            color: #a1a1aa;
            line-height: 1.6;
        }
        
        .retry-button {
            background: linear-gradient(to right, #00d4ff, #0080ff);
            border: none;
            color: white;
            padding: 1rem 2rem;
            font-size: 1rem;
            border-radius: 0.5rem;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        
        .retry-button:hover {
            opacity: 0.9;
        }
        
        .features {
            margin-top: 2rem;
            text-align: left;
        }
        
        .feature {
            margin-bottom: 0.5rem;
            color: #71717a;
        }
        
        .feature::before {
            content: "•";
            color: #00d4ff;
            font-weight: bold;
            margin-right: 0.5rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo"></div>
        <h1 class="title">You're Offline</h1>
        <p class="message">
            No internet connection detected. Please check your connection and try again.
        </p>
        <button class="retry-button" onclick="window.location.reload()">
            Try Again
        </button>
        
        <div class="features">
            <div class="feature">Multi-AI consensus network</div>
            <div class="feature">Truth verification & prediction markets</div>
            <div class="feature">Real-time AI collaboration</div>
        </div>
    </div>
    
    <script>
        // Auto-retry when connection is restored
        window.addEventListener('online', () => {
            setTimeout(() => {
                window.location.reload();
            }, 1000);
        });
        
        // Show connection status
        function updateConnectionStatus() {
            if (navigator.onLine) {
                document.querySelector('.message').textContent = 'Connection restored! Refreshing...';
                setTimeout(() => window.location.reload(), 1000);
            }
        }
        
        setInterval(updateConnectionStatus, 5000);
    </script>
</body>
</html>
