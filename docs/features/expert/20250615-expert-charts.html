e query counts.","children":[],"payload":{"tag":"li","lines":"26,27"}},{"content":"The chart now shows:","children":[{"content":"<strong>Total Queries</strong>: Number of queries processed per day.","children":[],"payload":{"tag":"li","lines":"28,29"}},{"content":"<strong>Consensus Reached</strong>: Number of queries where validators reached agreement.","children":[],"payload":{"tag":"li","lines":"29,30"}},{"content":"<strong>Consensus Failed</strong>: Number of queries where no agreement was reached.","children":[],"payload":{"tag":"li","lines":"30,31"}}],"payload":{"tag":"li","lines":"27,31"}},{"content":"Data is fetched from the <code>/api/vote-history</code> endpoint, grouped by date, and limited to the last 30 days.","children":[],"payload":{"tag":"li","lines":"31,32"}},{"content":"A total query count is displayed, fetched separately from the API.","children":[],"payload":{"tag":"li","lines":"32,33"}},{"content":"Users can toggle between viewing total queries, consensus reached, or consensus failed data using buttons.","children":[],"payload":{"tag":"li","lines":"33,34"}},{"content":"Loading and empty states were added for better usability.","children":[],"payload":{"tag":"li","lines":"34,35"}},{"content":"The Y-axis was added to show query counts clearly, and tooltips were enhanced to show detailed data per date.","children":[],"payload":{"tag":"li","lines":"35,37"}}],"payload":{"tag":"li","lines":"25,37","listIndex":4}},{"content":"5. \n<p data-lines=\"37,38\"><strong>Revamped Staking Area Chart for Consensus Trends</strong></p>","children":[{"content":"The <code>components/ask/charts/staking-area-stacked.tsx</code> file was updated to show real network consensus trends instead of placeholder staking and rewards data.","children":[],"payload":{"tag":"li","lines":"38,39"}},{"content":"The chart now displays:","children":[{"content":"<strong>Consensus Rate</strong>: Percentage of vote sessions per month where consensus was reached.","children":[],"payload":{"tag":"li","lines":"40,41"}},{"content":"<strong>Participation Rate</strong>: Percentage of validators participating in votes per month.","children":[],"payload":{"tag":"li","lines":"41,42"}}],"payload":{"tag":"li","lines":"39,42"}},{"content":"Data is fetched from the <code>/api/vote-history</code> endpoint, processed to calculate monthly rates, and limited to the last 6 months.","children":[],"payload":{"tag":"li","lines":"42,43"}},{"content":"A trend indicator shows whether the consensus rate is increasing or decreasing compared to the previous month, with a percentage value.","children":[],"payload":{"tag":"li","lines":"43,44"}},{"content":"Loading and empty states were added to handle data fetching and unavailable data scenarios.","children":[],"payload":{"tag":"li","lines":"44,45"}},{"content":"The chart uses an area chart format with stacked areas for consensus and participation rates, making trends easy to visualize.","children":[],"payload":{"tag":"li","lines":"45,46"}},{"content":"The title changed from &quot;Truth Staking Projections&quot; to &quot;Network Consensus Trends,&quot; reflecting the focus on actual network data.","children":[],"payload":{"tag":"li","lines":"46,48"}}],"payload":{"tag":"li","lines":"37,48","listIndex":5}},{"content":"6. \n<p data-lines=\"48,49\"><strong>New Top-Voted Responses Component</strong></p>","children":[{"content":"A new component (<code>components/ask/consensus/top-voted-responses.tsx</code>) was added to display the most upvoted and downvoted responses for a vote session.","children":[],"payload":{"tag":"li","lines":"49,50"}},{"content":"Features include:","children":[{"content":"Displays responses in two columns: one for most upvoted and one for most downvoted.","children":[],"payload":{"tag":"li","lines":"51,52"}},{"content":"Each response shows the validator&#x2019;s name, provider, vote (YES/NO), rationale (truncated if too long), and vote count (upvotes or downvotes).","children":[],"payload":{"tag":"li","lines":"52,53"}},{"content":"Visual indicators (green up arrow for upvotes, red down arrow for downvotes) and badges (for YES/NO votes) make the UI intuitive.","children":[],"payload":{"tag":"li","lines":"53,54"}},{"content":"Supports mock data when no vote session ID is provided (for testing or demo purposes).","children":[],"payload":{"tag":"li","lines":"54,55"}},{"content":"Fetches real data from the <code>/api/vote-sessions/[voteSessionId]/top-responses</code> endpoint when a vote session ID is available.","children":[],"payload":{"tag":"li","lines":"55,56"}},{"content":"Includes a loading state with a pulsing animation to improve user experience while data is being fetched.","children":[],"payload":{"tag":"li","lines":"56,57"}}],"payload":{"tag":"li","lines":"50,57"}},{"content":"This component is used in both the explorer page and the ask results page (see next point).","children":[],"payload":{"tag":"li","lines":"57,59"}}],"payload":{"tag":"li","lines":"48,59","listIndex":6}},{"content":"7. \n<p data-lines=\"59,60\"><strong>Top-Voted Responses Added to Ask Results Page</strong></p>","children":[{"content":"The <code>components/ask/results/ask-results-expert.tsx</code> file was updated to include the <code>TopVotedResponses</code> component.","children":[],"payload":{"tag":"li","lines":"60,61"}},{"content":"It shows the top-voted responses for the current vote session, alongside validator results and vote history.","children":[],"payload":{"tag":"li","lines":"61,62"}},{"content":"This makes the ask results page more comprehensive, allowing users to see community feedback on validator responses.","children":[],"payload":{"tag":"li","lines":"62,64"}}],"payload":{"tag":"li","lines":"59,64","listIndex":7}},{"content":"8. \n<p data-lines=\"64,65\"><strong>Minor Vote History Component Update</strong></p>","children":[{"content":"The <code>components/ask/consensus/vote-history.tsx</code> file received a small update to improve error handling in the vote history fetching logic.
